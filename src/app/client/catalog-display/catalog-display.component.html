<div class="container py-3">
  <div class="text-center mb-4">
    <h2 class="fw-semibold text-main-blue">Sélectionnez un catalogue</h2>
    <p class="text-muted small">Choisissez un catalogue pour afficher les produits correspondants.</p>
  </div>

  <div class="row gy-3">
    <div class="col-12 col-md-6 col-xl-3" *ngFor="let catalog of catalogs">
      <button 
        class="catalog-card"
        [ngClass]="{ 'selected': selectedCatalogId === catalog.id_catalog }"
        (click)="onSelectCatalog(catalog.id_catalog)"
        (keydown.enter)="onSelectCatalog(catalog.id_catalog)"
        [attr.aria-pressed]="selectedCatalogId === catalog.id_catalog"
        type="button"
        [attr.title]="'Sélectionner le catalogue ' + catalog.name"
      >
        <div class="catalog-icon mb-2">
          <i class="bi bi-book"></i>
        </div>
        <h3 class="catalog-title">
          {{ catalog.name }}
          <span *ngIf="selectedCatalogId === catalog.id_catalog" class="badge bg-light text-dark ms-1">
            <i class="fas fa-check-circle text-success"></i>
          </span>
        </h3>
        <p class="catalog-description mt-1">Voir les produits disponibles</p>
      </button>
    </div>
  </div>
   <div *ngIf="selectedCatalogId" class="mt-5 mb-3 text-center fade-in">
    <h4 class="section-title">Produits du catalogue sélectionné</h4>
    <p class="section-subtitle text-muted small">Parcourez les produits disponibles et simulez leur impact énergétique.</p>
  </div>

</div>

<app-products [catalogId]="selectedCatalogId"></app-products>
