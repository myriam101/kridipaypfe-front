<h2 mat-dialog-title class="dialog-title">{{ data.product.name }}</h2>

<div mat-dialog-content class="dialog-content">
  <div class="image-wrapper">
<div class="image-wrapper">
  <div class="image-zone d-flex justify-content-center align-items-center mb-3 position-relative">
    
    <button 
      *ngIf="product.images?.length > 1"
      class="btn btn-outline-secondary btn-nav me-2"
      (click)="prevImage($event)"
      aria-label="Image précédente"
    >
      ‹
    </button>

    <img
      [src]="product.images?.length > 0 
              ? product.images[product.currentImageIndex] 
              : 'assets/imagenotavailble.png'"
      alt="Image produit"
      class="product-preview"
    />

    <button 
      *ngIf="product.images?.length > 1"
      class="btn btn-outline-secondary btn-nav ms-2"
      (click)="nextImage($event)"
      aria-label="Image suivante"
    >
      ›
    </button>
  </div>
</div>

   
  </div>

  <p class="description" *ngIf="data.product.short_description">{{ data.product.short_description }}</p>

  <div class="product-meta">
    <span class="brand" *ngIf="data.product.brand">{{ data.product.brand }}</span>
    <span class="reference" *ngIf="data.product.reference">{{ data.product.reference }}</span>
  </div>

  <!-- Affichage des points de bonification si visibles -->
  <div *ngIf="data.product.bonifvisible === 1" class="mt-3">
    <span class="bonif-badge">
       {{ data.product.bonifpoint }} pts bonus client
    </span>
  </div>

  <!-- Affichage des caractéristiques -->
  <div *ngIf="product?.features && objectKeys(product.features).length" class="mt-4">
    <h4>Caractéristiques :</h4>
    <ul>
      <li *ngFor="let feature of objectKeys(product.features)">
        <strong>{{ feature | titlecase }}:</strong>
        <span>{{ product.features[feature] }}</span>
      </li>
    </ul>
  </div>
</div>

<!-- Actions -->
<div mat-dialog-actions class="d-flex justify-content-end px-3 pb-3 gap-2">
  <button mat-button mat-dialog-close color="warn">Fermer</button>
  <button class="btn btn-primary" (click)="addToCart()">
    <i class="bi bi-graph-up-arrow me-1"></i> Ajouter au panier
  </button>
</div>
