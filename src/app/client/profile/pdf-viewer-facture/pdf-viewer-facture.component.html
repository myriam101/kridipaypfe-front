<div class="container py-3">

<div class="text-center mb-3">
    <p class="text-muted fst-italic small">Aperçu de la facture d’énergie.</p>
  </div>

<mat-dialog-content>
  <div *ngIf="isLoading" class="text-center my-5">
    Chargement du PDF...
  </div>

  <pdf-viewer
    *ngIf="!isLoading && pdfUrl"
    [src]="pdfUrl"
    [render-text]="true"
    [show-all]="true"
    [original-size]="false"
    style="height: 600px; border: 1px solid #ccc; border-radius: 6px;">
  </pdf-viewer>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Fermer</button>
</mat-dialog-actions>
</div>
