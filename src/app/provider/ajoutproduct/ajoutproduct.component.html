<div class="card shadow-sm border-0 rounded-4 form-card h-100 d-flex flex-column">
  <!-- HEADER FIXE -->
  <div>
    <h4 class="mb-2 text-primary text-center">
      Ajout d’un produit dans 
      <span class="text-muted small fst-italic ms-1">{{ data.Catalogname }}</span>
    </h4>
  </div>

  <!-- CORPS SCROLLABLE -->
  <div class="scrollable-body card-body">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <!-- Colonne gauche : Champs de base -->
        <div class="col-md-6">
          <div class="mb-3">
            <input formControlName="name" class="form-control" placeholder="Nom du produit">
          </div>
          <div class="mb-3">
            <input formControlName="brand" class="form-control" placeholder="Entrez la marque">
          </div>
          <div class="mb-3">
            <input formControlName="reference" class="form-control" placeholder="Entrez la référence">
          </div>
          <div class="mb-3">
            <textarea formControlName="short_description" class="form-control" rows="3" placeholder="Brève description..."></textarea>
          </div>
          <div class="mb-3">
            <select class="form-select" formControlName="category_id" (change)="onDesignationChange($event)">
              <option [ngValue]="null" disabled>Choisissez une catégorie</option>
              <option *ngFor="let cat of categories" [value]="cat.id">
                {{ getDesignationName(cat.designation) }}
              </option>
            </select>
          </div>
        </div>

        <!-- Colonne droite : Features (formGroupName) -->
        <div class="col-md-6" formGroupName="features">
          <div class="mb-3">
            <input type="number" formControlName="weight" class="form-control" placeholder="Poids (kg)">
          </div>
          <div class="mb-3">
            <input type="number" formControlName="power" class="form-control" placeholder="Puissance (W)">
          </div>
          <div class="mb-3">
            <select class="form-select" formControlName="energy_class">
              <option [ngValue]="null" disabled>Classe énergétique</option>
              <option *ngFor="let classe of energyClasses" [ngValue]="classe">{{ classe }}</option>
            </select>
          </div>

          <!-- Champs spécifiques dynamiques -->
          <ng-container *ngIf="isLaveLinge">
            <input type="number" class="form-control mb-3" formControlName="cycle_duration" placeholder="Durée du cycle">
            <input type="number" class="form-control mb-3" formControlName="consumption_liter" placeholder="Consommation L/cycle">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation kWh">
            <input type="number" class="form-control mb-3" formControlName="capacity" placeholder="Capacité">
          </ng-container>

          <ng-container *ngIf="isRefrigerateur">
            <input type="number" class="form-control mb-3" formControlName="volume_refrigeration" placeholder="Volume refrigeration">
            <input type="number" class="form-control mb-3" formControlName="volume_freezer" placeholder="Volume congélateur">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="capacity" placeholder="Capacité">
          </ng-container>

          <ng-container *ngIf="isSecheLinge || isLavanteSechante || isLaveVaisselle">
            <input type="number" class="form-control mb-3" formControlName="noise" placeholder="Bruit (dB)">
            <input type="number" class="form-control mb-3" formControlName="capacity" placeholder="Capacité">
            <input type="number" class="form-control mb-3" formControlName="cycle_duration" placeholder="Durée du cycle">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input *ngIf="isLavanteSechante || isLaveVaisselle" type="number" class="form-control mb-3" formControlName="consumption_liter" placeholder="Consommation LITRES">
            <input *ngIf="isLaveVaisselle" type="number" class="form-control mb-3" formControlName="nbr_couvert" placeholder="Nombre de couverts">
          </ng-container>

          <ng-container *ngIf="isFour || isClimatiseur || isHotte || isTableCuisson">
            <input *ngIf="!isTableCuisson" type="number" class="form-control mb-3" formControlName="noise" placeholder="Bruit (dB)">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <select class="form-select mb-3" formControlName="type">
              <option [ngValue]="null" disabled>Choisissez un type</option>
              <option *ngFor="let type of typefeatures" [value]="type">{{ type }}</option>
            </select>
            <input *ngIf="isClimatiseur" type="number" class="form-control mb-3" formControlName="scop" placeholder="SCOP">
            <input *ngIf="isClimatiseur" type="number" class="form-control mb-3" formControlName="seer" placeholder="SEER">
          </ng-container>

          <ng-container *ngIf="isCaveVin">
            <input type="number" class="form-control mb-3" formControlName="noise" placeholder="Bruit (dB)">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="nb_bottle" placeholder="Nombre de bouteilles">
          </ng-container>

          <ng-container *ngIf="isCongelateur">
            <input type="number" class="form-control mb-3" formControlName="volume_freezer" placeholder="Volume congélateur">
            <input type="number" class="form-control mb-3" formControlName="noise" placeholder="Bruit (dB)">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="capacity" placeholder="Capacité">
          </ng-container>

          <ng-container *ngIf="isAspirateur">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="noise" placeholder="Bruit (dB)">
            <input type="number" class="form-control mb-3" formControlName="volume_collect" placeholder="Volume de collecte">
          </ng-container>

          <ng-container *ngIf="isChauffage || isChauffeEau || isChaudiere">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="debit" placeholder="Débit">
          </ng-container>

          <ng-container *ngIf="isTv">
            <input type="number" class="form-control mb-3" formControlName="consumption_watt" placeholder="Consommation WATT">
            <input type="number" class="form-control mb-3" formControlName="hdr_consumption" placeholder="Conso mode HDR">
            <input type="number" class="form-control mb-3" formControlName="sdr_consumption" placeholder="Conso mode SDR">
            <input type="number" class="form-control mb-3" formControlName="diagonal" placeholder="Diagonale (pouces)">
            <input type="number" class="form-control mb-3" formControlName="resolution" placeholder="Résolution (px)">
          </ng-container>
        </div>
      </div>

      <div *ngIf="successMessage" class="alert alert-success mt-3">
        {{ successMessage }}
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Ajouter le produit</button>
      </div>
    </form>
  </div>
</div>
