 <div class="loader-container" *ngIf="isLoading">
  <div class="loader"></div>
</div>

<div *ngIf="!isLoading && !catalogId" class="text-center mt-4">
  <p class="text-muted">Sélectionnez un catalogue pour afficher ses produits.</p>
</div>

<div *ngIf="!isLoading && catalogId">
  <div class="container">
    
    <div class="bg-light border rounded p-3 mb-4">
      <div class="d-flex align-items-center justify-content-between">
        <label for="carbonToggle" class="form-label mb-0">Visibilité impact négatif :</label>
        <div class="form-check form-switch d-flex align-items-center">
          <input
            class="form-check-input"
            type="checkbox"
            id="carbonToggle"
            [(ngModel)]="carbonVisible"
            (change)="toggleCarbonVisibility()"
          />
          <label class="form-check-label ms-2" for="carbonToggle" style="min-width: 80px; white-space: nowrap;">
            {{ carbonVisible ? 'Activée' : 'Désactivée' }}
          </label>
        </div>
      </div>
    </div>

    <ng-container  *ngIf="products.length > 0; else noProducts">
      <div class="row clearfix gy-3">
    <div *ngFor="let product of products" class="col-lg-3 col-md-4 col-sm-12">
          <div class="card product_item position-relative shadow-hover">

           <!-- Badge Carbone -->
<div 
  *ngIf="carbonVisible"
  class="carbon-icon"
[ngClass]="carbonBadges[product.id] || 'undefined'"
  matTooltip="{{ getCarbonBadgeText(carbonBadges[product.id]) }}"
  matTooltipPosition="right"
  matTooltipClass="custom-tooltip"
  aria-label="Empreinte carbone"
  role="img"
>
  <i class="zmdi zmdi-globe"></i> 
</div>


            <div class="cp_img" data-bs-toggle="tooltip" data-bs-placement="top">
  <!-- Image courante -->
      <img 
        [src]="product.images && product.images.length > 0 
              ? product.images[product.currentImageIndex] 
              : 'assets/imagenotavailble.png'" 
        alt="{{ product.name }}" 
        class="img-fluid product-img"
      >

      <!-- Flèches de navigation -->
      <button 
        *ngIf="product.images && product.images.length > 1" 
        class="btn btn-sm btn-outline-secondary position-absolute start-0 top-50 translate-middle-y"
        style="z-index: 10;"
        (click)="prevImage(product, $event)"
        aria-label="Image précédente"
      >
        ‹
      </button>

      <button 
        *ngIf="product.images && product.images.length > 1" 
        class="btn btn-sm btn-outline-secondary position-absolute end-0 top-50 translate-middle-y"
        style="z-index: 10;"
        (click)="nextImage(product, $event)"
        aria-label="Image suivante"
      >
        ›
      </button>           <div class="hover">
  <button class="btn btn-sm btn-outline-danger mt-2" (click)="deleteProduct(product.id)">
<i class="zmdi zmdi-delete"></i></button>

              </div>
            </div>

            <div class="product_details text-center">
              <h5 class="product-title">
                <a >{{ product.name }}</a>
              </h5>
              <em class="product-category">{{ product.category }}</em>
              <p class="product-brand">{{ product.brand }}</p>

              <div *ngIf="product.bonifvisible === 1" class="mt-2">
                <span class="bonif-badge">{{ product.bonifpoint }} pts bonus</span>
              </div>
            </div>

          </div>
        </div>

    
      </div>  </ng-container>

    <ng-template #noProducts>
      <div class="text-center mt-4">
        <p class="text-danger">Aucun produit trouvé.</p>
      </div>
    </ng-template>

  </div>
</div>
