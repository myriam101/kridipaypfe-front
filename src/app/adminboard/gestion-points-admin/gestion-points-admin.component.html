<div class="container-fluid min-vh-100 py-4">
  <div class="text-center mb-5">
    <h3 class="fw-bold" style="color:#216490;">
      <i class="bi bi-gear-fill me-2"></i>Gestion des points
    </h3>
    <p class="text-secondary fst-italic">Gérez les packs points bonifiants.</p>
  </div>
  <div class="card shadow-sm">
  <div class="card-body p-2 p-md-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Fournisseur</th>
            <th>Adresse</th>
            <th class="text-center">Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let provider of pagedProviders">
            <td>
              <div class="d-flex align-items-center">
                <div class="d-flex flex-column">
                  <span class="fw-semibold">{{ provider.name }}</span>
                  <small class="text-muted fst-italic">ID : {{ provider.id }}</small>
                </div>
              </div>
            </td>
            <td>{{ provider.adress || 'Adresse non renseignée' }}</td>
            <td class="text-center position-relative">
              <span class="status-label" [ngClass]="{ 'active': provider.points_visible, 'inactive': !provider.points_visible }">
                <span class="status-dot"></span>
                {{ provider.points_visible ? 'Actif' : 'Inactif' }}
              </span>
            </td>
            <td class="text-end">
              <div class="btn-group" role="group">
                <button
                  class="btn btn-sm btn-outline-secondary"
                  title="Afficher/Masquer"
                  (click)="toggleVisibility(provider)">
                  <i class="fa" [ngClass]="provider.points_visible ? 'fa-eye' : 'fa-eye-slash'"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="loader-container" *ngIf="isLoading">
        <div class="loader"></div>
      </div>

      <div *ngIf="pagedProviders.length === 0" class="alert alert-info text-center mt-3">
        Aucun fournisseur trouvé.
      </div>
    </div>

    <!-- Pagination + Page size -->
    <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">
      <div class="d-flex align-items-center gap-2">
        <label for="pageSizeSelect" class="mb-0" style="color: #216490; font-weight: 600;">Afficher :</label>
        <select id="pageSizeSelect" [(ngModel)]="pageSize" (change)="onPageSizeChange()" class="form-select form-select-sm w-auto">
          <option *ngFor="let size of pageSizes" [value]="size">{{ size }}</option>
        </select>
        <span style="color: #216490; font-weight: 600;">fournisseurs par page</span>
      </div>

      <nav *ngIf="totalPages > 1" aria-label="Pagination">
        <ul class="pagination mb-0">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link pagination-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1" style="color: #216490;">
              &laquo;
            </button>
          </li>

          <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
              [class.active]="currentPage === i + 1">
            <button class="page-link pagination-btn" (click)="goToPage(i + 1)" style="color: #216490;">
              {{ i + 1 }}
            </button>
          </li>

          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link pagination-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages" style="color: #216490;">
              &raquo;
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>



</div>
