<div class="container py-4" style="position: relative;">
    <!-- Bouton close en haut à droite du modal -->
  <button aria-label="Fermer le comparateur" class="modal-close-btn" (click)="closeDialog()">
    <i class="zmdi zmdi-close"></i>

  </button>
  <h3 #titleElement class="text-center mb-4 fw-bold" style="color: #216490; position: relative;">
    Comparateur Écologique
  </h3>

  <!-- Tooltip flottant au-dessus du titre -->
  <div
    *ngIf="showInfoTooltip"
    class="custom-tooltip fixed-tooltip"
    [style.top.px]="tooltipPosition.top"
    [style.left.px]="tooltipPosition.left"
    role="tooltip"
    aria-live="polite"
  >
    <button aria-label="Fermer l'aide" class="btn-close-tooltip" (click)="closeInfoTooltip()">×</button>
    <div>
      Comparer deux produits ici! Exemple: je veux comparer le produit <strong>BIOLUX</strong> et <strong>ECOBUBBLE</strong>
    </div>
    <div class="tooltip-arrow"></div>
  </div>

  <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden">
    <input
      type="text"
      [(ngModel)]="question"
      class="form-control form-control-lg border-0 px-4"
      placeholder="Pose ta question écologique ici..."
    />
    <button (click)="submitQuestion()" class="btn btn-lg text-white px-4" style="background-color: #216490;">
      Comparer
    </button>
  </div>

  <div class="chat-container">

    <!-- Indicateur de traitement -->
    <div *ngIf="isTyping" class="chat-bubble bot typing animate">
      <span class="typing-indicator"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMsg" class="chat-bubble bot error animate">
      {{ errorMsg }}
    </div>

    <!-- Comparaison -->
   <div *ngIf="response?.type === 'comparaison'" class="chat-bubble bot animate">
  
  <div class="comparison-grid">
    <div *ngFor="let p of response?.products" class="product-card">
      <div class="product-header">
        <strong class="product-name">{{ p.name }}</strong>
        <small class="text-muted d-block">{{ p.brand }}</small>
      </div>
      <div class="product-metrics">
        <div class="metric">
          <span class="metric-icon"><i class="zmdi zmdi-globe" style="color: #216490;"></i>
</span>
          <span class="metric-label">CO₂</span>
          <span class="metric-value">{{ p.carbon }} kg</span>
        </div>
        <div class="metric">
          <span class="metric-icon"><i class="fa fa-tint" aria-hidden="true"style="color: #216490;"></i>
</span>
          <span class="metric-label">Eau</span>
          <span class="metric-value">{{ p.water }} L</span>
        </div>
        <div class="metric">
          <span class="metric-icon"><i class="zmdi zmdi-lamp" style="color: #216490;"></i>
</span>
          <span class="metric-label">Électricité</span>
          <span class="metric-value">{{ p.electricity }} W</span>
        </div>
      </div>
    </div>
  </div>

  <p class="fst-italic text-muted mt-4 text-center">{{ response?.comparison }}</p>
</div>


    <!-- Catégorie mismatch -->
    <div *ngIf="response?.type === 'categorie_mismatch'" class="chat-bubble bot animate">
      <p>{{ response?.message }}</p>
    </div>

  </div>

</div>
